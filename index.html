<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路歴（a2）</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #14170f;
      --ink: #eeeeee;
      --link: #66ccff;
      --line: #444444;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .wrap {
      max-width: 40rem;
      margin-inline: auto;
      padding-inline: 1rem;
    }

    header {
      background: #111111;
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      color: var(--link);
      text-underline-offset: .25em;
    }

    nav a[aria-current="page"] {
      color: var(--ink);
      font-weight: 700;
    }

    nav a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    h1 {
      margin-block: 2rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
    }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="メインメニュー">
      <a href="./" aria-current="page">トップ</a>
      <a href="https://moriyatakashi.github.io/a1/">路歴（a1）</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>路歴（a2）</h1>
  </main>
</body>
</html>
