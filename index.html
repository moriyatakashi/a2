<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路歴（a2）</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #14170f;
      --ink: #eeeeee;
      --link: #66ccff;
      --line: #444444;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .wrap {
      max-width: 40rem;
      margin-inline: auto;
      padding-inline: 1rem;
    }

    header {
      background: #111111;
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
    }

    nav a, nav button {
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      color: var(--link);
      text-underline-offset: .25em;
    }

    nav a[aria-current="page"] {
      color: var(--ink);
      font-weight: 700;
    }

    nav a:focus-visible, nav button:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    .auth {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    nav button {
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    nav button:disabled {
      opacity: .65;
      cursor: default;
    }

    #auth-menu { position: relative; }
    #auth-menu summary { font-size: .875rem; color: #c6c9be; cursor: pointer; }
    #auth-menu button {
      position: absolute;
      inset-inline-end: 0;
      z-index: 1;
      min-height: 2.5rem;
      padding: .35rem .7rem;
      background: #111;
      border: 1px solid var(--line);
      border-radius: .3rem;
      white-space: nowrap;
    }

    #auth-error:empty {
      margin: 0;
      padding: 0;
    }

    #auth-error {
      color: #ffb4ab;
    }

    nav button[hidden], #chira-panel[hidden], #issues-panel[hidden], #issue-form[hidden] { display: none; }

    .chira-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .chira-list details {
      overflow-wrap: anywhere;
    }

    .chira-list summary {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      padding: .375rem 0;
      cursor: pointer;
      line-height: 1.4;
    }

    .chira-list summary::-webkit-details-marker { display: none; }

    .chira-list summary:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }

    .chira-meta {
      font-size: .875rem;
      color: #c6c9be;
    }

    .chira-preview {
      text-decoration: underline;
      text-underline-offset: .15em;
    }

    .chira-list p {
      margin: 0 0 .5rem;
      padding: .25rem 0 .25rem .75rem;
      border-inline-start: 2px solid var(--line);
      white-space: pre-wrap;
    }

    #issue-form, #issue-list { margin-block: 1rem; }
    #issue-form fieldset {
      display: grid;
      gap: .65rem;
      border: 0;
      padding: 0;
      margin: 0;
    }
    #issue-form label { display: grid; gap: .25rem; }
    #issues-panel :is(button, input, textarea, select) {
      font: inherit;
      color: inherit;
      background: #111;
      border: 1px solid var(--line);
      border-radius: .3rem;
      padding: .4rem .6rem;
    }
    #issue-list { padding: 0; list-style: none; }
    #issue-list li { border-bottom: 1px solid var(--line); }
    #issue-list summary {
      padding: .55rem 0;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    #issue-list p { white-space: pre-wrap; overflow-wrap: anywhere; }
    #issue-list label { display: block; margin-bottom: .65rem; }

    #wiki-list { padding-inline-start: 1.25rem; }
    #wiki-list a, #wiki-body a { color: var(--link); }
    #wiki-list li { margin-block: .35rem; }
    #wiki-panel fieldset, #wiki-panel label { display: grid; gap: .4rem; }
    #wiki-panel fieldset { border: 0; padding: 0; margin: 1rem 0; gap: .75rem; }
    #wiki-panel :is(button, input, textarea, select) {
      font: inherit;
      color: inherit;
      background: #111;
      border: 1px solid var(--line);
      border-radius: .3rem;
      padding: .4rem .6rem;
      max-width: 100%;
    }
    #wiki-link-tools, .wiki-actions { display: flex; flex-wrap: wrap; align-items: end; gap: .5rem; }
    #wiki-panel :is(article, li) { overflow-wrap: anywhere; }
    #wiki-body p { margin-block: .65rem; }

    h1 {
      margin-block: 2rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
    }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="メインメニュー">
      <a href="./" aria-current="page">トップ</a>
      <button id="chira-button" type="button" aria-controls="chira-panel" aria-expanded="false" hidden>チラ裏</button>
      <button id="issues-button" type="button" aria-controls="issues-panel" aria-expanded="false" hidden>課題</button>
      <button id="wiki-button" type="button" aria-controls="wiki-panel" aria-expanded="false" hidden>Wiki</button>
      <div class="auth">
        <button id="auth-button" type="button" disabled>ログイン</button>
        <details id="auth-menu" hidden>
          <summary>ログイン済み</summary>
          <button id="signout-button" type="button">ログアウト</button>
        </details>
      </div>
    </nav>
    <p id="auth-error" class="wrap" role="alert"></p>
  </header>
  <main class="wrap">
    <h1>路歴（a2）</h1>
    <p id="canada-result" role="status"></p>
    <section id="chira-panel" aria-labelledby="chira-title" hidden>
      <h2 id="chira-title">チラ裏</h2>
      <p id="chira-status" role="status"></p>
      <ul id="chira-list" class="chira-list"></ul>
    </section>
    <section id="issues-panel" aria-labelledby="issues-title" hidden>
      <h2 id="issues-title">課題</h2>
      <label><input id="issues-show-done" type="checkbox"> 済みも表示</label>
      <button id="issue-new" type="button" aria-controls="issue-form" aria-expanded="false" disabled>新規登録</button>
      <form id="issue-form" hidden>
        <fieldset>
          <label>件名 <input name="title" maxlength="120" required></label>
          <label>詳細 <textarea name="detail" rows="4" maxlength="4000"></textarea></label>
          <button type="submit">登録する</button>
        </fieldset>
      </form>
      <p id="issue-status" role="status"></p>
      <ul id="issue-list"></ul>
    </section>
    <section id="wiki-panel" aria-labelledby="wiki-title" hidden>
      <h2 id="wiki-title">Wiki</h2>
      <button id="wiki-new" type="button" disabled>新規ページ</button>
      <p id="wiki-status" role="status"></p>
      <ul id="wiki-list"></ul>
      <article id="wiki-article" hidden>
        <h3 id="wiki-page-title"></h3>
        <div id="wiki-body"></div>
        <button id="wiki-edit" type="button">編集</button>
      </article>
      <form id="wiki-form" hidden>
        <fieldset>
          <label>タイトル <input name="title" maxlength="120" required></label>
          <label>本文（Markdown） <textarea name="body" rows="8" maxlength="12000" required></textarea></label>
          <div id="wiki-link-tools">
            <label>関連用語 <select name="link"></select></label>
            <button id="wiki-insert" type="button">リンクを挿入</button>
          </div>
          <div class="wiki-actions">
            <button type="submit">保存</button>
            <button id="wiki-cancel" type="button">キャンセル</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>
  <script type="module">
    import { setupWiki } from "./wiki.js";

    const authButton = document.querySelector("#auth-button");
    const authMenu = document.querySelector("#auth-menu");
    const signoutButton = document.querySelector("#signout-button");
    const authError = document.querySelector("#auth-error");
    const canadaResult = document.querySelector("#canada-result");

    const firebaseConfig = {
      apiKey: "AIzaSyDuPw8nMuFWx8ghV5ZeBGETeiNII3uk4l8",
      authDomain: "ab01-9f35a.firebaseapp.com",
      projectId: "ab01-9f35a",
      appId: "1:502154862201:web:4ca0c72225af6bd0147ea8",
    };

    function setupChira(app) {
      const button = document.querySelector("#chira-button");
      const panel = document.querySelector("#chira-panel");
      const list = document.querySelector("#chira-list");
      const status = document.querySelector("#chira-status");
      const dateFormat = new Intl.DateTimeFormat("ja-JP", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
        hourCycle: "h23", timeZone: "Asia/Tokyo",
      });
      let revision = 0;
      let expiryTimer;
      let signedIn = false;

      function close() {
        revision++;
        clearTimeout(expiryTimer);
        panel.hidden = true;
        button.setAttribute("aria-expanded", "false");
        list.replaceChildren();
        status.textContent = "";
      }

      function removeExpired() {
        clearTimeout(expiryTimer);
        const now = Date.now();
        let nextExpiry = Infinity;
        for (const item of list.children) {
          const expiry = Number(item.dataset.expiry);
          if (expiry > now) nextExpiry = Math.min(nextExpiry, expiry);
        }
        for (const item of [...list.children]) {
          if (Number(item.dataset.expiry) <= now) item.remove();
        }
        status.textContent = list.children.length ? "" : "チラ裏は空です。";
        if (Number.isFinite(nextExpiry)) {
          expiryTimer = setTimeout(removeExpired, Math.min(nextExpiry - now, 2147483647));
        }
      }

      async function syncChiraRoute() {
        if (!signedIn || location.hash !== "#chira") {
          close();
          return;
        }
        if (!panel.hidden) return;
        const request = ++revision;
        panel.hidden = false;
        button.setAttribute("aria-expanded", "true");
        status.textContent = "チラ裏を読み込み中…";
        try {
          const { collection, getDocsFromServer, getFirestore, orderBy, query } =
            await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js");
          const snapshot = await getDocsFromServer(query(collection(getFirestore(app), "chiraura"), orderBy("at", "desc")));
          if (request !== revision) return;
          for (const doc of snapshot.docs) {
            const { at, by, body, expire_at } = doc.data();
            const expiry = expire_at?.toMillis?.();
            const posted = at?.toDate?.() ?? new Date(at);
            if (!Number.isFinite(expiry) || expiry <= Date.now() || !Number.isFinite(posted.getTime()) || typeof body !== "string") continue;
            const item = document.createElement("li");
            item.dataset.expiry = expiry;
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            const time = document.createElement("time");
            time.dateTime = posted.toISOString();
            time.textContent = dateFormat.format(posted);
            const meta = document.createElement("span");
            meta.className = "chira-meta";
            meta.append(time, ` ${by || "投稿者不明"} `);
            const preview = document.createElement("span");
            preview.className = "chira-preview";
            preview.textContent = body.split(/\\r?\\n/, 1)[0] || "（先頭行は空）";
            summary.append(meta, preview);
            const full = document.createElement("p");
            full.textContent = body;
            details.append(summary, full);
            item.append(details);
            list.append(item);
          }
          removeExpired();
        } catch (error) {
          if (request !== revision) return;
          status.textContent = error.code === "permission-denied"
            ? "チラ裏を読む権限がありません。"
            : "チラ裏を読み込めませんでした。開き直してお試しください。";
        }
      }

      button.addEventListener("click", () => {
        location.hash = location.hash === "#chira" ? "" : "chira";
      });
      window.addEventListener("hashchange", syncChiraRoute);

      return (user) => {
        close();
        signedIn = Boolean(user);
        button.hidden = !signedIn;
        syncChiraRoute();
      };
    }

    function setupIssues(app) {
      const button = document.querySelector("#issues-button");
      const panel = document.querySelector("#issues-panel");
      const newButton = document.querySelector("#issue-new");
      const form = document.querySelector("#issue-form");
      const fields = form.querySelector("fieldset");
      const titleInput = form.elements.namedItem("title");
      const detailInput = form.elements.namedItem("detail");
      const status = document.querySelector("#issue-status");
      const list = document.querySelector("#issue-list");
      const labels = { open: "未対応", review: "確認中", done: "済み" };
      let revision = 0;
      let db;
      let signedIn = false;
      const showDone = document.querySelector("#issues-show-done");
      try { showDone.checked = localStorage.getItem("a2-show-done") === "true"; } catch {}

      function route() {
        if (location.hash === "#issues") return "";
        return /^#issue-([A-Za-z0-9_-]+)$/.exec(location.hash)?.[1] ?? null;
      }

      function applyRoute() {
        const selected = route();
        for (const row of list.children) {
          const active = row.dataset.id === selected;
          row.firstElementChild.open = active;
          row.hidden = !showDone.checked && row.dataset.status === "done" && !active;
        }
      }

      showDone.addEventListener("change", () => {
        try { localStorage.setItem("a2-show-done", String(showDone.checked)); } catch {}
        if (!showDone.checked && [...list.children].some(row => row.dataset.id === route() && row.dataset.status === "done")) {
          location.hash = "issues";
        }
        applyRoute();
      });

      function setFormVisible(visible) {
        form.hidden = !visible;
        newButton.setAttribute("aria-expanded", String(visible));
      }

      function close() {
        revision++;
        panel.hidden = true;
        button.setAttribute("aria-expanded", "false");
        newButton.disabled = true;
        fields.disabled = false;
        setFormVisible(false);
        form.reset();
        status.textContent = "";
        list.replaceChildren();
      }

      async function firestore() {
        const sdk = await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js");
        db ??= sdk.getFirestore(app);
        return sdk;
      }

      function issueRow(id, issue) {
        const row = document.createElement("li");
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        const body = document.createElement("p");
        const label = document.createElement("label");
        const select = document.createElement("select");
        let saved = issue.status;
        row.dataset.id = id;

        function updateSummary() {
          row.dataset.status = saved;
          summary.textContent = `${issue.number ? "#" + issue.number + " " : ""}[${labels[saved]}] ${issue.title}`;
        }

        updateSummary();
        summary.addEventListener("click", (event) => {
          event.preventDefault();
          location.hash = details.open ? "issues" : "issue-" + id;
        });
        body.textContent = issue.detail || "詳細なし";
        for (const [value, text] of Object.entries(labels)) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = text;
          select.append(option);
        }
        select.value = saved;
        select.addEventListener("change", async () => {
          const request = revision;
          const next = select.value;
          select.disabled = true;
          try {
            const { doc, serverTimestamp, updateDoc } = await firestore();
            if (request !== revision) return;
            await updateDoc(doc(db, "a2Issues", id), { status: next, updatedAt: serverTimestamp() });
            if (request !== revision) return;
            saved = next;
            updateSummary();
            if (next === "done" && !showDone.checked && route() === id) location.hash = "issues";
            applyRoute();
            status.textContent = "状態を更新しました。";
          } catch {
            if (request === revision) status.textContent = "状態を更新できませんでした。";
          } finally {
            select.value = saved;
            select.disabled = false;
          }
        });
        label.append("状態 ", select);
        details.append(summary, body, label);
        row.append(details);
        return row;
      }

      async function syncIssuesRoute() {
        if (!signedIn || route() === null) {
          close();
          return;
        }
        if (!panel.hidden) {
          applyRoute();
          return;
        }
        const request = ++revision;
        panel.hidden = false;
        button.setAttribute("aria-expanded", "true");
        status.textContent = "課題を読み込み中…";
        try {
          const { collection, getDocsFromServer, orderBy, query } = await firestore();
          if (request !== revision) return;
          const result = await getDocsFromServer(query(collection(db, "a2Issues"), orderBy("createdAt", "desc")));
          if (request !== revision) return;
          list.replaceChildren(...result.docs.map(doc => issueRow(doc.id, doc.data())));
          newButton.disabled = false;
          applyRoute();
          status.textContent = result.empty ? "課題はまだありません。" : "";
        } catch (error) {
          if (request !== revision) return;
          status.textContent = error.code === "permission-denied"
            ? "課題を読む権限がありません。"
            : "課題を読み込めませんでした。開き直してお試しください。";
        }
      }

      button.addEventListener("click", () => {
        location.hash = route() === null ? "issues" : "";
      });
      window.addEventListener("hashchange", syncIssuesRoute);

      newButton.addEventListener("click", () => {
        setFormVisible(form.hidden);
        if (!form.hidden) titleInput.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) {
          status.textContent = "件名を入力してください。";
          titleInput.focus();
          return;
        }
        const request = revision;
        const issue = { title, detail: detailInput.value.trim(), status: "open" };
        fields.disabled = true;
        status.textContent = "登録中…";
        try {
          const { collection, doc, runTransaction, serverTimestamp } = await firestore();
          if (request !== revision) return;
          const ref = doc(collection(db, "a2Issues"));
          const counter = doc(db, "_meta", "a2_issue_seq");
          issue.number = await runTransaction(db, async (transaction) => {
            const snapshot = await transaction.get(counter);
            const number = snapshot.data().value + 1;
            transaction.update(counter, { value: number, issueId: ref.id });
            transaction.set(ref, { ...issue, number, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
            return number;
          });
          if (request !== revision) return;
          list.prepend(issueRow(ref.id, issue));
          applyRoute();
          form.reset();
          setFormVisible(false);
          newButton.focus();
          status.textContent = "課題を登録しました。";
        } catch {
          if (request === revision) status.textContent = "課題を登録できませんでした。";
        } finally {
          if (request === revision) fields.disabled = false;
        }
      });

      return (user) => {
        close();
        signedIn = Boolean(user);
        button.hidden = !signedIn;
        syncIssuesRoute();
      };
    }

    function showError(error, fallback) {
      const messages = {
        "auth/popup-blocked": "ポップアップを許可してから、もう一度ログインしてください。",
        "auth/unauthorized-domain": "このサイトは Firebase Authentication の承認済みドメインに登録されていません。",
        "auth/network-request-failed": "通信できませんでした。接続を確認して、もう一度お試しください。",
      };
      authError.textContent = messages[error.code] ?? fallback;
    }

    async function readCanada(app) {
      const { getFirestore, doc, getDocFromServer } =
        await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js");
      const snapshot = await getDocFromServer(doc(getFirestore(app), "a2Tests", "canada"));
      const message = snapshot.data()?.message;
      return typeof message === "string" && message.trim()
        ? message
        : "Canada のテスト文書が用意されていません。";
    }

    async function setupAuth() {
      const [{ initializeApp }, firebaseAuth] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js"),
      ]);
      const { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } = firebaseAuth;
      const app = initializeApp(firebaseConfig, "a2");
      const auth = getAuth(app);
      let authRevision = 0;
      const canadaCheck = new URLSearchParams(location.search).get("check") === "canada";
      const updateChiraAuth = setupChira(app);
      const updateIssuesAuth = setupIssues(app);
      const updateWikiAuth = setupWiki(app);

      onAuthStateChanged(auth, async (user) => {
        const revision = ++authRevision;
        updateChiraAuth(user);
        updateIssuesAuth(user);
        updateWikiAuth(user);
        authMenu.open = false;
        authMenu.hidden = !user;
        authButton.hidden = Boolean(user);
        authButton.disabled = false;
        canadaResult.textContent = user && canadaCheck ? "Firestore を読み込み中…" : "";
        if (!user || !canadaCheck) return;

        try {
          const message = await readCanada(app);
          if (revision === authRevision) canadaResult.textContent = message;
        } catch (error) {
          if (revision !== authRevision) return;
          canadaResult.textContent = error.code === "permission-denied"
            ? "Canada のテスト文書を読む権限がありません。"
            : "Firestore から読み込めませんでした。";
        }
      });

      async function changeAuth(event) {
        const action = event.currentTarget;
        const signingOut = action === signoutButton;
        authError.textContent = "";
        action.disabled = true;
        try {
          if (signingOut) {
            await signOut(auth);
          } else {
            await signInWithPopup(auth, new GoogleAuthProvider());
          }
        } catch (error) {
          if (error.code !== "auth/popup-closed-by-user") {
            showError(error, signingOut ? "ログアウトできませんでした。" : "Google ログインに失敗しました。");
          }
        } finally {
          action.disabled = false;
        }
      }
      authButton.addEventListener("click", changeAuth);
      signoutButton.addEventListener("click", changeAuth);
    }

    setupAuth().catch((error) => {
      showError(error, "ログイン機能を読み込めませんでした。ページを再読み込みしてください。");
    });
  </script>
</body>
</html>
