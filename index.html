<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路歴（a2）</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #14170f;
      --ink: #eeeeee;
      --link: #66ccff;
      --line: #444444;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
    }

    .wrap {
      max-width: 40rem;
      margin-inline: auto;
      padding-inline: 1rem;
    }

    header {
      background: #111111;
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.5rem;
    }

    nav a, .auth button {
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      color: var(--link);
      text-underline-offset: .25em;
    }

    nav a[aria-current="page"] {
      color: var(--ink);
      font-weight: 700;
    }

    nav a:focus-visible, .auth button:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    .auth {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .auth button {
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .auth button:disabled {
      opacity: .65;
      cursor: default;
    }

    #auth-state:empty, #auth-error:empty {
      margin: 0;
      padding: 0;
    }

    #auth-error {
      color: #ffb4ab;
    }

    h1 {
      margin-block: 2rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
    }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="メインメニュー">
      <a href="./" aria-current="page">トップ</a>
      <a href="https://moriyatakashi.github.io/a1/">路歴（a1）</a>
      <div class="auth">
        <span id="auth-state" role="status"></span>
        <button id="auth-button" type="button" disabled>ログイン</button>
      </div>
    </nav>
    <p id="auth-error" class="wrap" role="alert"></p>
  </header>
  <main class="wrap">
    <h1>路歴（a2）</h1>
    <p id="canada-result" role="status"></p>
  </main>
  <script type="module">
    const authButton = document.querySelector("#auth-button");
    const authState = document.querySelector("#auth-state");
    const authError = document.querySelector("#auth-error");
    const canadaResult = document.querySelector("#canada-result");

    const firebaseConfig = {
      apiKey: "AIzaSyDuPw8nMuFWx8ghV5ZeBGETeiNII3uk4l8",
      authDomain: "ab01-9f35a.firebaseapp.com",
      projectId: "ab01-9f35a",
      appId: "1:502154862201:web:4ca0c72225af6bd0147ea8",
    };

    function showError(error, fallback) {
      const messages = {
        "auth/popup-blocked": "ポップアップを許可してから、もう一度ログインしてください。",
        "auth/unauthorized-domain": "このサイトは Firebase Authentication の承認済みドメインに登録されていません。",
        "auth/network-request-failed": "通信できませんでした。接続を確認して、もう一度お試しください。",
      };
      authError.textContent = messages[error.code] ?? fallback;
    }

    async function readCanada(app) {
      const { getFirestore, doc, getDocFromServer } =
        await import("https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js");
      const snapshot = await getDocFromServer(doc(getFirestore(app), "a2Tests", "canada"));
      const message = snapshot.data()?.message;
      return typeof message === "string" && message.trim()
        ? message
        : "Canada のテスト文書が用意されていません。";
    }

    async function setupAuth() {
      const [{ initializeApp }, firebaseAuth] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js"),
      ]);
      const { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } = firebaseAuth;
      const app = initializeApp(firebaseConfig, "a2");
      const auth = getAuth(app);
      let authRevision = 0;

      onAuthStateChanged(auth, async (user) => {
        const revision = ++authRevision;
        authState.textContent = user ? "ログイン済み" : "";
        authButton.textContent = user ? "ログアウト" : "ログイン";
        authButton.disabled = false;
        canadaResult.textContent = user ? "Firestore を読み込み中…" : "";
        if (!user) return;

        try {
          const message = await readCanada(app);
          if (revision === authRevision) canadaResult.textContent = message;
        } catch (error) {
          if (revision !== authRevision) return;
          canadaResult.textContent = error.code === "permission-denied"
            ? "Canada のテスト文書を読む権限がありません。"
            : "Firestore から読み込めませんでした。";
        }
      });

      authButton.addEventListener("click", async () => {
        const signingOut = Boolean(auth.currentUser);
        authError.textContent = "";
        authButton.disabled = true;
        try {
          if (signingOut) {
            await signOut(auth);
          } else {
            await signInWithPopup(auth, new GoogleAuthProvider());
          }
        } catch (error) {
          if (error.code !== "auth/popup-closed-by-user") {
            showError(error, signingOut ? "ログアウトできませんでした。" : "Google ログインに失敗しました。");
          }
        } finally {
          authButton.disabled = false;
        }
      });
    }

    setupAuth().catch((error) => {
      showError(error, "ログイン機能を読み込めませんでした。ページを再読み込みしてください。");
    });
  </script>
</body>
</html>
